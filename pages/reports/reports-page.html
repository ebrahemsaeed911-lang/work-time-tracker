<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a09">
  <meta name="description" content="تطبيق لتسجيل الحضور والانصراف وحساب ساعات العمل والمرتب">
  <meta property="og:title" content="التقارير - Work Time Tracker">
  <meta property="og:description" content="تطبيق لتسجيل الحضور والانصراف وحساب ساعات العمل والمرتب المتوقع والخصومات">
  <meta property="og:url" content="https://work-time-tracker-ibrahim.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_AR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Work Tracker">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="../../assets/icons/icon.svg">
  <title>التقارير - Work Time Tracker</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="styles/reports-page.css">
</head>
<body>
  <div class="app-container">
    <header data-component="page-header" data-variant="default" data-title="التقارير"></header>

    <main>
      <div class="report-period">
        <div class="date-range">
          <div class="form-group">
            <label class="form-label">من تاريخ</label>
            <input type="date" id="reportDateFrom" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">إلى تاريخ</label>
            <input type="date" id="reportDateTo" class="form-input">
          </div>
        </div>
      </div>

      <div class="card report-summary">
        <div class="stat-card">
          <span class="stat-label">إجمالي الساعات</span>
          <span class="stat-value" id="reportTotalHours" style="font-size:1.25rem;">0 س</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">أيام العمل</span>
          <span class="stat-value" id="reportWorkDays" style="font-size:1.25rem;">0 يوم</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">المرتب قبل الخصم</span>
          <span class="stat-value text-success" id="reportExpectedSalary" style="font-size:1.25rem;">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">الخصومات</span>
          <span class="stat-value text-danger" id="reportDeductions" style="font-size:1.25rem;">0</span>
        </div>
        <div class="stat-card full-width" style="border-color:var(--primary);">
          <span class="stat-label">صافي المرتب</span>
          <span class="stat-value text-primary" id="reportNetSalary" style="font-size:1.5rem;">0</span>
        </div>
      </div>

      <div class="report-actions">
        <button id="exportPDF" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
          </svg>
          تصدير PDF
        </button>
        <button id="exportCSV" class="btn btn-outline">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          تصدير CSV
        </button>
      </div>

      <div class="card">
        <h2 class="section-title">تفاصيل الشيفتات</h2>
        <div class="report-table-wrapper">
          <table class="report-table">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>الحضور</th>
                <th>الانصراف</th>
                <th>المدة</th>
                <th>ملاحظات</th>
              </tr>
            </thead>
            <tbody id="reportShiftsBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <nav data-component="bottom-navigation" data-active="reports"></nav>

  <script type="module" src="reports-page.js"></script>
</body>
</html>
