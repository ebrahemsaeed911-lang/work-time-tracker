<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a09">
  <meta name="description" content="تطبيق لتسجيل الحضور والانصراف وحساب ساعات العمل والمرتب">
  <meta property="og:title" content="Work Time Tracker">
  <meta property="og:description" content="تطبيق لتسجيل الحضور والانصراف وحساب ساعات العمل والمرتب المتوقع والخصومات">
  <meta property="og:url" content="https://work-time-tracker-ibrahim.vercel.app/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_AR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Work Tracker">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="../../assets/icons/icon.svg">
  <title>الرئيسية - Work Time Tracker</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="styles/dashboard-page.css">
</head>
<body>
  <div class="app-container">
    <header data-component="page-header" data-variant="default" data-title="Work Time Tracker"></header>

    <main>
      <div class="attendance-actions">
        <div class="attendance-btn-wrap">
          <button id="checkInBtn" class="btn btn-check-in">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            تسجيل حضور
          </button>
        </div>
        <div class="attendance-btn-wrap">
          <button id="checkOutBtn" class="btn btn-check-out">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            تسجيل انصراف
          </button>
        </div>
      </div>

      <div id="lastRecord"></div>

      <div class="stats-grid">
        <div class="stat-card fade-in">
          <div class="stat-icon hours">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div class="stat-label">ساعات الشهر</div>
          <div class="stat-value" id="totalHours">0</div>
          <div class="stat-sub">إجمالي ساعات العمل</div>
        </div>

        <div class="stat-card fade-in">
          <div class="stat-icon salary">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <div class="stat-label">المرتب المتوقع</div>
          <div class="stat-value" id="expectedSalary">0</div>
          <div class="stat-sub">قبل الخصومات</div>
        </div>

        <div class="stat-card fade-in">
          <div class="stat-icon deductions">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </div>
          <div class="stat-label">الخصومات</div>
          <div class="stat-value" id="totalDeductions">0</div>
          <div class="stat-sub">إجمالي الخصومات</div>
        </div>

        <div class="stat-card fade-in">
          <div class="stat-icon net">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <div class="stat-label">صافي المرتب</div>
          <div class="stat-value" id="netSalary">0</div>
          <div class="stat-sub">بعد الخصومات</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="section-title" style="margin-bottom:0;">سجل الشيفتات</h2>
          <span class="badge badge-primary" id="workDays">0 يوم</span>
        </div>
        <div id="recentShiftsContainer"></div>
      </div>
    </main>
  </div>

  <nav data-component="bottom-navigation" data-active="dashboard"></nav>

  <script type="module" src="dashboard-page.js"></script>
</body>
</html>
